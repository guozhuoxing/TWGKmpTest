name: iosApp
options:
  bundleIdPrefix: nz.co.warehouseandroidtest
  deploymentTarget:
    iOS: 17.0
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: nz.co.warehouseandroidtest.iosApp
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework", "$(SRCROOT)/../shared/build/bin/iosX64/debugFramework", "$(inherited)"]
      HEADER_SEARCH_PATHS: ["$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework/Headers", "$(inherited)"]
      OTHER_LDFLAGS: ["-framework shared"]
      LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleIdentifier: nz.co.warehouseandroidtest.iosApp
        CFBundleName: iosApp
        CFBundleDisplayName: iosApp
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
    preBuildScripts:
      - name: Build shared framework
        script: |
          export JAVA_HOME="$HOME/Library/Java/JavaVirtualMachines/jbr-17.0.14/Contents/Home"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd ..
          ./gradlew :shared:linkIosX64 :shared:linkIosSimulatorArm64 --console=plain
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy shared.framework
        script: |
          if [ -d "$SRCROOT/../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework" ]; then
            cp -R "$SRCROOT/../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
          elif [ -d "$SRCROOT/../shared/build/bin/iosX64/debugFramework/shared.framework" ]; then
            cp -R "$SRCROOT/../shared/build/bin/iosX64/debugFramework/shared.framework" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
          fi
        basedOnDependencyAnalysis: false
    embedFrameworks:
      - ../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework
      - ../shared/build/bin/iosX64/debugFramework/shared.framework
